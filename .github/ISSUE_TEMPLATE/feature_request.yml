name: Feature request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. The more specific you can be, the easier it is to evaluate.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? What's missing or awkward right now?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you'd like to see, and how it should behave.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you thought about, and why this one seems better.
    validations:
      required: false

  - type: dropdown
    id: service
    attributes:
      label: Which Service Does This Affect?
      options:
        - Frontend
        - Backend
        - Both
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Anything else worth mentioning, such as similar features in other tools.
    validations:
      required: false