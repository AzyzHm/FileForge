name: Documentation
description: Report unclear, missing, or incorrect documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Found something confusing or wrong in the docs? Let us know.

  - type: input
    id: location
    attributes:
      label: Location
      description: Which file or section is this about?
      placeholder: e.g. frontend/README.md, root README.md, a code comment
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: Issue
      description: What's unclear, missing, or incorrect?
    validations:
      required: true

  - type: textarea
    id: suggested_fix
    attributes:
      label: Suggested Fix
      description: If you have a specific rewording or addition in mind, include it here. Otherwise, describe what would make it clearer.
    validations:
      required: false